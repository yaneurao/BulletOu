[package]
name = "bullet_lib"
version = "1.0.0"
authors = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
readme = { workspace = true }
rust-version = { workspace = true }
edition = { workspace = true }
description = "Neural Network Trainer"

[dependencies]
bullet-compiler = { workspace = true }
bullet-gpu = { workspace = true }
bullet-trainer = { workspace = true }
bulletformat = "1.8.0"
montyformat = "0.9.2"
sfbinpack = "0.6.0"
viriformat = "2.0.1"

[features]
device-cuda = ["bullet-gpu/device-cuda", "bullet-trainer/device-cuda"]
device-rocm = ["bullet-gpu/device-rocm", "bullet-trainer/device-rocm"]
# Threat profile gate. canonical test を除外するために使う build-time フラグ。
# 通常の build では無効 (= canonical test 有効)。
threat-profile-same-class = []
threat-profile-same-class-major-pawn = []

[dev-dependencies]
clap = { workspace = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

