[package]
name = "bulletou-cuda-train"
version = "0.1.0"
edition = { workspace = true }
license = { workspace = true }
repository = { workspace = true }
rust-version = { workspace = true }
publish = false

[lints]
workspace = true

[features]
default = []
cuda = [
    "bulletou-cuda-oxide-runtime/cuda",
    "dep:cuda-core",
    "dep:cuda-device",
    "dep:cuda-host",
]

[[bin]]
name = "bulletou-cuda-train"
path = "src/main.rs"

[dependencies]
bulletou-cuda-oxide-runtime = { path = "../../crates/runtime" }
cuda-core = { workspace = true, optional = true }
cuda-device = { workspace = true, optional = true }
cuda-host = { workspace = true, optional = true }
